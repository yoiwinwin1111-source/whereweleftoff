{title:'那个号码没有换',date:'重逢当天 · 星期一',week:1,prose:['午休只剩二十分钟，你低头翻优惠券，直到柜台后的人问：“冰的，还是热的？”','金道勋看着你，手停在收银屏旁。五年把他的轮廓磨得更清晰，那一刻的停顿却像高中走廊里忽然对视的时候。','你问他是不是在这里工作。他低头按下订单：“今天在。”杯子递过来时，他小心地避开了你的指尖。','后来，你们在没有镜头的拐角交换了联系方式。他问：“这次，还会删掉吗？”你摇头。他才接过手机。','回到公司，通讯录里多了一个五年没出现过的名字。你把那张小票摊平，连一句开场白都没写好。'],beats:[{intro:['我是金道勋。','号码没有换。你换了。'],choices:['今天见到你，我很高兴。','我想跟你说几句话，但还没整理好。'],replies:[['……嗯。','我也没想到会遇到你。','你先忙吧。不是说午休快结束了吗。'],['那就先不用说。','不过，如果你说会来找我。','这一次，别让我一直等。']]}]},
{title:'我还不知道怎么原谅',date:'第一周 · 星期三',week:1,prose:['那两天，你每天都点开聊天框。你不再是那个被考试和排名压得喘不过气的高中生，可面对他，还是会想把难说的话删掉。','你终于提起道歉。他隔了一阵才回复：“为什么现在才想说？”','妈妈这时发来一张旧盒子的照片。钥匙链旁边压着一张卡片，字有点歪，是道勋高中时写的。','她问这个盒子还要不要。你把照片放大，想起他把礼物塞进你手里以后，又装作若无其事地问晚饭吃什么。'],beats:[{intro:['为什么现在才想说？','我不是不让你道歉。','只是，我还不知道该怎么回答。'],choices:['我那时压力很大，但断联伤害了你，这不是理由。','我一直想说，却又怕你早就不想听了。'],replies:[['我知道你那时候难过。','可我不知道，为什么我也成了你必须丢掉的事情。','我今天可能说不出没关系。'],['你没有问过我。','你替我决定了我不想听，又替我决定了不用再联系。','我不是现在还要怪你。只是那件事，真的留了很久。']]},{intro:['还在吗？'],choices:['我想整理一下，明天再好好说。我会回来。','我没有走。只是刚才有点难受，想慢一点说。'],replies:[['好。明天。','不用把每句话都想得很漂亮。','你说会回来，我先信这一次。'],['……我也是。','那就慢一点。','不要因为今天没说好，就当以后也不用说了。']]}]},
{title:'从别人的屏幕里认识他',date:'第一周 · 星期四 · 节目播出',week:1,prose:['同事把节目转进工作群：“楼下那家咖啡店上镜了。”你点开，看见他系着那天的围裙。画面旁边写着 TWS DOHOON。','你的追星记忆还停在十年前，直到这一刻才把熟悉的名字和那个舞台上的人连在一起。','节目保留了点单时他出神的镜头，没有拍到交换联系方式。那是镜头外的事，只有你们知道。','你把片段发给 oo。她是你大学才认识的朋友，不知道高中时发生过什么。她先以为你只是偶遇明星，等你说出“我们以前在一起过”，聊天框突然安静了几秒。'],beats:[{intro:['节目播了。','如果有人打扰你，告诉我。'],choices:['我今天才知道你是 TWS 成员。那天我是真的以为你在打工。','原来这五年，你去了那么多我不知道的地方。'],replies:[['那天你认出的是我。','这样就够了。','只是，没想到你真的会再联系我。'],['也没有你想的那么远。','换了很多地方，有些事也还是会想起来。','你呢？这些年过得好不好。']]},{intro:['你不用因为这个，就突然不知道怎么跟我说话。'],choices:['那我还是照常问：今天吃过饭了吗？','我需要重新认识现在的你。但我想认识。'],replies:[['吃过了。','你以前也会在放学路上这样问。','……你呢。别又只喝咖啡。'],['好。','我也是。','先从今天开始吧，不用一下补完五年。']]}]},
{title:'你还留着这个？',date:'第二周 · 星期五',week:2,requires:'keychain',prose:['妈妈寄来的盒子到了。你擦掉钥匙链上的灰，重新挂回包上。没有刻意想让他看见，出门时却又确认了一次它的位置。','你们在便利店门口碰面。拿钥匙时，道勋的目光停在你的手边。','“这个，你还留着？”你点头，说一直没舍得扔。他伸手碰了碰旧掉的边角，没马上看你。','“那为什么当时，连一句话都不肯留给我？”这次你没有把包收起来，也没有换个轻松的话题。'],beats:[{intro:['刚才那个钥匙链。','我以为你早就扔掉了。'],choices:['我一直没舍得扔。我也一直没有好好面对分手的事。','那时候我总觉得自己什么都做不好，越被你好好对待越慌张。'],replies:[['我今天看到它，确实很高兴。','但高兴完，又有点难过。','我不知道你留着它的时候，有没有想过我也会想你。'],['你可以告诉我啊。','如果你说想慢一点，我会等。','我不是要你现在补偿我。我只是也想把当年的话说完。']]},{intro:['你现在是不是也想把聊天框关掉了？'],choices:['有一点想躲。但我会留下来听你说完。','我需要缓一缓，今晚九点再找你，可以吗？'],replies:[['好。','我也会好好说。','今天先别急着把这件事变成一个好结局。'],['可以。九点。','谢谢你告诉我你是想缓一缓。','这跟突然消失，不一样。']]}]},
{title:'这次，我没有消失',date:'第三至四周',week:3,prose:['你们没有因为钥匙链就复合。接下来几周，发生的只是一些很小、又和以前不同的事。','你答应回来解释，真的在约好的时间出现。他答应下班后见你，却因录制延迟失了约。你没有说“算了”，也没有删掉他。','你承认自己失落。他在结束工作后打来电话，告诉你不是不想见，而是今天实在没有办法。你们第一次把一场不愉快谈完，没有用断联收场。','另一个晚上，他打来电话，只问你吃过没有。两个人分享歌单，听了高中时会听的歌，也听他现在的歌。','那次视频通话里，他终于说出，五年前自己曾经等过你的消息。'],beats:[{intro:['九点了。','我在。'],choices:['我来了。刚才说需要缓一下，不是要结束这场对话。','我把那时候想说却没说的话写下来了，可以慢慢告诉你吗？'],replies:[['嗯，我知道。','你今天真的回来了。','我想……我得慢慢习惯这件事。'],['可以。','不用一次说完。','我也有一些话，一直没找到地方放。']]},{date:'第三周 · 星期六 · 23:16',intro:['对不起，录制还没结束。','今天可能没办法按时过去了。'],choices:['我有点失落，但知道你不是故意的。结束后告诉我一声吧。','我等了很久，确实不开心。我们改约，也把时间说清楚，好吗？'],replies:[['好。你先回家，不要在外面一直等。','结束后我打给你。','谢谢你直接跟我说。我不想靠猜你是不是又不想理我了。'],['应该的。是我今天没有安排好。','下次不确定能不能结束，我会提前告诉你。','你可以不开心，不用先替我找借口。']]},{date:'第四周 · 星期二 · 00:12',call:true,intro:['吃过晚饭了吗？','我没有别的事。就是想听听你的声音。','方便接一下视频吗？'],choices:['我还记得那时候放学后的电话。这次我会好好说。','谢谢你告诉我，你当年真的等过。我没有把这件事当作小事。'],replies:[['嗯。','今天听完你说的，我还是会难过。','但没有像以前那样，只剩我一个人在想。'],['我知道。','这次你没有说完对不起就离开。','我们先这样，慢慢来。']]}]},
{title:'我们重新开始，好不好？',date:'第五周 · 星期一',week:5,prose:['你发现自己会期待他的消息，却也不再因为一段沉默就否定一切。这些日子里，他会主动打来电话，也会坦白自己仍然害怕。','你先告诉他，重新联系不只是为了道歉。你一直放不下，也仍然喜欢他。','他没有立刻答应。他说自己听见了，想再想一想。你答应，不用马上给答案。','几天后，见面结束时他没有马上走。楼下的路灯亮起来，他说：“我不会当那五年没有发生。但我也不想，因为害怕就一直停在这里。”'],beats:[{intro:['你昨天说，有件事想认真告诉我。'],choices:['我仍然喜欢你。回来找你，不只是想让自己不再愧疚。','我想重新靠近你。但你不用因为我说了喜欢，就现在给答案。'],replies:[['我听见了。','我也不是没有想过。','你让我再想一想，好不好？我想认认真真回答。'],['……谢谢你。','不是谢谢你还喜欢我。','是谢谢你这次，愿意让我也选一次。']]},{date:'第五周 · 星期四 · 见面以后',intro:['{name}，等一下。','这几天我想了很多。','难过的时候告诉我，想暂停也告诉我。不要再用消失代替回答。','我们重新在一起，好不好？'],confirm:true,choices:['好。这次我会把话说出来，也听你说。','我愿意。我们都慢慢学，但不要再替对方做决定。'],replies:[['好。','那现在，可以牵你的手了吧。','以后辛苦的时候，也留在我身边。'],['嗯，一起学。','这一次不是回到高中。','是现在的我们，重新开始。']]}]},
{title:'藏在内侧的刻字',date:'第六周 · 周末',week:6,prose:['复合后的第一次休息日，他带来一只小盒子。不是用礼物替代告白，关系早已经被你们认真确认过。','里面是一条日常款的手链，带着小小的金属配件。刻字藏在内侧，只有拿下来才看得见。','他自己也戴了一条。你翻过来想看，他把手伸给你，却在你念出刻字以前先笑了。','你拍了一张桌边的照片。手腕、咖啡、袋子里的钥匙链，都可以入镜，也可以被你留在画面外。你们还没有把关系告诉所有人。'],beats:[{intro:['上次那个旧钥匙链，你说一直没舍得扔。','这次想送你一个新的。','刻字在里面。不是给别人看的。'],choices:['那我好好收着。这次我们一起留下新的回忆。','我想拍一张今天的照片。什么能公开，我们一起商量。'],replies:[['不用怕用旧。','旧了以后也可以继续戴。','东西可以陪你很久，人也是。'],['好。你想发就发。','不用为了照顾我，就觉得自己的日子什么也不能记录。','如果之后遇到什么事，我们一起处理。']]}]},
{title:'我们一起决定',date:'第六周以后',week:6,prose:['后来，一段虚构节目花絮里，道勋抬手时露出了相似的手链配件。外面的观众看不见内侧刻字，也不知道你们说过什么。','如果你公开发过手链入镜的照片，有人会觉得眼熟、开始对比；如果没有，时间线就只有围绕他节目状态的泛泛猜测。','讨论不会告诉别人一个确定的答案。你可以保留、隐藏或删除自己的帖子，也可以只调整之后的可见范围。','oo 先来问你有没有被打扰。道勋先问你是什么感受，再和你商量。他们都没有替你做决定。','故事停在一个普通的晚上。两个人没有正式公开，但已经能一起面对问题。手机里还会有下班后的消息，和明天再见的约定。'],beats:[{intro:['刚才看到一些讨论。','你有没有被打扰？','先告诉我你是什么感受。不用急着为了我删掉什么。'],choices:['我想先调整可见范围。不是后悔，只是想给自己一点空间。','我想保留自己的日常，但不回应关系猜测。'],replies:[['好。你先按让自己舒服的方式来。','已经出现的讨论不会马上消失，新的线索我们可以少留一点。','如果觉得不舒服，随时告诉我。'],['好，我尊重。','不用向陌生人证明什么。','我们知道现在在一起的是谁，就够了。']]}]}
];

function pump(){if(replyTimer||!S.queue.length)return;replyTimer=setTimeout(()=>{replyTimer=null;const m=S.queue.shift();if(m&&m.stage===S.stage&&m.beat===S.beat)log('other',m.text);if(!S.queue.length){S.step=S.after?.step||'choice';if(S.after?.confirm){S.flags.confirmed=true;S.flags.confirmedAt=Date.now()}if(S.after?.confession)S.flags.confessed=true;if(S.after?.gift)S.flags.bracelet=true;S.after=null}save();refreshConversation();pump()},Math.min(2400,950+(S.queue[0]?.text.length||0)*24))}
function ensureScene(){const key=S.stage+':'+S.beat;if(!S.entered.includes(key)){S.entered.push(key);if(S.stage===1)ensureSide('mom');if(S.stage===2&&!S.flags.broadcast)S.flags.broadcast=Date.now();queue(beat().intro,{step:'choice'})}}
function openChat(who='dohoon'){contact=who;if(who==='dohoon')ensureScene();else ensureSide(who);go('chat')}
function ensureSide(who){for(const t of SIDE_TOPICS[who]){if(t.incoming&&t.at<=S.stage&&!S.usedTopics.includes('in:'+t.id)){S.usedTopics.push('in:'+t.id);t.incoming.forEach(text=>S.side[who].push({from:'other',text}));if(t.asset)S.side[who].push({from:'other',text:'',asset:t.asset})}}save()}
function choose(i){if(S.step!=='choice'||S.queue.length)return;if(stage().requires&&!S.flags[stage().requires]){openChat('mom');return}if(beat().call&&!S.flags.callDone){startCall();return}if(!beat().choices[i])return;log('me',beat().choices[i]);queue(beat().replies[i],{step:'done',confirm:!!beat().confirm,confession:S.stage===5&&S.beat===0,gift:S.stage===6});render()}
function advance(){if(S.step!=='done'||S.queue.length)return;if(S.beat<stage().beats.length-1){S.beat++;S.step='new';log('note',beat().date||'几天以后');ensureScene();render();return}if(S.stage===STORY.length-1){S.flags.finished=true;save();render();toast('故事还会继续，日常聊天和发帖仍然开放。');return}S.stage++;S.beat=0;S.step='new';if(S.stage===7){S.flags.material=true;S.flags.materialAt=Date.now()}readStage=S.stage;ensureScene();refreshDiscovery();save();go('reading')}
function chooseTopic(id,index){const t=SIDE_TOPICS[contact]?.find(t=>t.id===id&&t.at<=S.stage),c=t?.choices[index];if(!c)return;const use=contact+':'+id+':'+index;if(S.usedTopics.includes(use))return;S.usedTopics.push(use);S.side[contact].push({from:'me',text:c.text});if(t.asset)S.side[contact].push({from:'me',text:'',asset:t.asset});c.reply.forEach(text=>S.side[contact].push({from:'other',text}));if(c.flag)S.flags[c.flag]=true;save();render()}
function refreshConversation(){if(view!=='chat'||contact!=='dohoon')return;const draft=$('chatInput')?.value||'',focus=document.activeElement?.id==='chatInput';render();if($('chatInput')){$('chatInput').value=draft;if(focus)$('chatInput').focus()}}
function assetSVG(kind){const back=kind==='coffee'?'#d5bca6':kind==='keychain'?'#c8d8df':'#dbd3c9';let art='';if(kind==='coffee')art='<ellipse cx="180" cy="235" rx="82" ry="22" fill="#9d8068" opacity=".2"/><rect x="110" y="95" width="135" height="145" rx="25" fill="#f4efe4"/><ellipse cx="178" cy="100" rx="67" ry="19" fill="#4f3526"/><path d="M246 127c73-8 71 92-1 79" stroke="#f4efe4" stroke-width="20" fill="none"/>';else if(kind==='keychain')art='<rect x="58" y="54" width="245" height="252" rx="10" fill="#f4eee2"/><path d="M89 270l179-180" stroke="#d8cbb7"/><circle cx="168" cy="114" r="37" fill="none" stroke="#a3a5a1" stroke-width="11"/><path d="M172 153v28" stroke="#a3a5a1" stroke-width="8"/><rect x="142" y="178" width="62" height="83" rx="15" fill="#798f9c"/><path d="M157 213l17 13 15-13" stroke="#e1e7e8" stroke-width="3" fill="none"/>';else if(kind==='bracelet')art='<path d="M35 250C110 205 230 258 340 155" stroke="#c9aa94" stroke-width="90" stroke-linecap="round" fill="none"/><ellipse cx="194" cy="200" rx="57" ry="45" transform="rotate(-25 194 200)" fill="none" stroke="#9d9d92" stroke-width="8"/><rect x="225" y="165" width="21" height="27" rx="4" fill="#c5c4b9" transform="rotate(-25 225 165)"/><circle cx="177" cy="158" r="7" fill="#b3b5a8"/>';else art='<path d="M0 270L360 150v210H0" fill="#b5c3c7"/><rect x="89" y="77" width="167" height="171" rx="8" fill="#f3eee6"/><path d="M105 216l42-65 30 38 28-19 37 46" fill="#bdccc1"/>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360"><rect width="360" height="360" fill="${back}"/>${art}</svg>`)}
function effectivePublic(p){return !p.deleted&&!p.hidden&&p.scope==='public'&&(p.platform!=='x'||!S.xPrivate)}
function eligibleMatch(){return S.posts.filter(p=>p.asset==='bracelet'&&effectivePublic(p))}
function refreshDiscovery(){if(!S.flags.confirmed||!S.flags.material)return;const eligible=eligibleMatch();if(eligible.length&&!S.flags.discovery){S.flags.discovery={at:Date.now(),postId:eligible[0].id,freeze:null};S.side.oo.push({from:'other',text:'我看到有一些人在讨论相似的饰品。你有没有被打扰？我不转你的照片。'})}if(S.flags.discovery){const d=S.flags.discovery;if(!eligible.length&&d.freeze===null)d.freeze=Math.min(12,3+Math.floor((Date.now()-d.at)/8000));if(eligible.length)d.freeze=null;eligible.filter(p=>p.platform==='ig'&&!p.discoveryComments).forEach(p=>{p.discoveryComments=true;p.comments.push(...IG_DISCOVERY_COMMENTS.slice(0,23).map((text,i)=>({id:'ig-discover-'+i,name:SOCIAL_HANDLES[i],text,likes:17+i*29,reply:['同款只能说明外观相似。','嗯，大家不要去问私人身份。'].slice(0,1+i%2)})))})}}
function socialPosts(group){const start=group==='program'?S.flags.broadcast:group==='dating'?S.flags.confirmedAt:group==='matching'?S.flags.discovery?.at:0;if(group!=='daily'&&!start)return[];const elapsed=Math.max(0,Math.floor((Date.now()-start)/1000)),max=group==='matching'&&S.flags.discovery?.freeze!==null?S.flags.discovery.freeze:Infinity;return WORLD_POSTS.filter(p=>p.group===group&&(group==='daily'||p.index<Math.min(max,3+Math.floor(elapsed/8))))}
function visibleWorld(){return [...socialPosts('matching'),...socialPosts('dating'),...socialPosts('program'),...socialPosts('daily')]}
function worldById(id){return WORLD_POSTS.find(p=>p.id===id)}
function findPost(id){return S.posts.find(p=>p.id===id&&!p.deleted)}
function handleFor(platform){return platform==='ig'?S.igHandle:S.xHandle}
function postComments(p){const own=S.replies[p.id]||[];return [...p.comments,...own]}
function worldComments(p){return Array.from({length:p.commentCount},(_,i)=>({id:p.id+'-c'+i,name:SOCIAL_HANDLES[(p.index+i*3)%SOCIAL_HANDLES.length],text:COMMENT_POOLS[p.group][(p.index*2+i)%COMMENT_POOLS[p.group].length],likes:11+(p.index+1)*31+i*23,reply:[i%2?'我也只是觉得那个瞬间很好看。':'嗯，先保留不同的解释。','不去问现实里的人。'].slice(0,1+i%2)})).concat(S.replies[p.id]||[])}
function count(n){return n>=10000?(n/10000).toFixed(1)+'万':n>=1000?(n/1000).toFixed(1)+'千':String(n)}
function createPost(platform,{caption='',asset='none',scope='public',image=''}={}){if(!['ig','x'].includes(platform))return null;if(platform==='x'&&S.xPrivate&&scope==='public')scope='friends';if(!S.flags.bracelet&&['bracelet','cropped'].includes(asset))return null;if(asset==='keychain'&&!S.flags.keychain)return null;if(!['public','friends','private'].includes(scope))return null;const p={id:'own-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),platform,caption:caption.slice(0,800),asset,scope,image,time:Date.now(),comments:[],hidden:false,deleted:false};if(scope==='friends'){p.comments.push({id:p.id+'-oo',name:'oo',text:asset==='bracelet'?'新手链很好看。下次见面给我看看？':'今天也好好生活。等你忙完聊。',likes:1,reply:[]})}else if(scope==='public'){p.comments.push(...(asset==='coffee'?['这杯看起来不错。','午休去买咖啡也太幸福了。','今天也辛苦啦。']:['这张照片的颜色很好看。','很普通的一天，也值得记住。']).map((text,i)=>({id:p.id+'-c'+i,name:SOCIAL_HANDLES[(i+4)%32],text,likes:3+i*7,reply:[]})))}const rollback=JSON.stringify(S);S.posts.unshift(p);refreshDiscovery();if(!save()){S=JSON.parse(rollback);return null}if(asset==='keychain'&&scope!=='private'&&!S.flags.keychainShared){S.flags.keychainShared=true;log('other','你发的那张照片……是以前那个钥匙链吗？');save()}return p}
function changeScope(id,scope){const p=findPost(id);if(!p||!['public','friends','private'].includes(scope))return;p.scope=p.platform==='x'&&S.xPrivate&&scope==='public'?'friends':scope;p.hidden=false;refreshDiscovery();save();render()}
function hidePost(id){const p=findPost(id);if(!p)return;p.hidden=true;refreshDiscovery();save();sheet=null;render()}
function deletePost(id){const p=findPost(id);if(!p)return;p.deleted=true;refreshDiscovery();save();sheet=null;render()}
function toggleXPrivacy(){S.xPrivate=!S.xPrivate;refreshDiscovery();save();render()}
function openSheet(type,id){sheet={type,id,expanded:[]};renderSheet()}
function commentRows(){if(!sheet)return[];if(sheet.type==='world'){const p=worldById(sheet.id);return p?worldComments(p):[]}const p=findPost(sheet.id);return p?postComments(p):[]}
function renderSheet(){let root=$('commentsOverlay');if(!root){root=document.createElement('div');root.id='commentsOverlay';$('phone').appendChild(root)}if(!sheet){root.innerHTML='';return}const p=findPost(sheet.id),rows=commentRows();root.innerHTML=`<div class="comment-shade"><section class="comment-sheet" role="dialog" aria-modal="true" aria-label="评论"><header><b>${sheet.type==='manage'?'帖子设置':'评论 · '+rows.length}</b><button data-do="closeSheet" aria-label="关闭评论">×</button></header>${sheet.type==='manage'&&p?`<div class="sheet-body"><label class="inputlabel" for="scopeChange">可见范围</label><select id="scopeChange" class="nameinput">${scopeOptions(p.platform,p.scope)}</select><button class="secondary" data-do="applyScope" data-id="${p.id}">保存范围</button><button class="secondary" data-do="hidePost" data-id="${p.id}">隐藏帖子</button><button class="linkbtn" data-do="askDelete" data-id="${p.id}">删除帖子</button></div>`:sheet.type==='delete'?`<div class="sheet-body"><p>删除这条帖子？已经出现的讨论不会立刻消失。</p><button class="primary" data-do="deletePost" data-id="${sheet.id}">删除</button></div>`:`<div class="sheet-body" id="commentList">${rows.length?rows.map(c=>`<article class="comment-row"><div class="comment-avatar">${esc(c.name.slice(0,1).toUpperCase())}</div><div class="grow"><b>${esc(c.name)}</b><p>${esc(txt(c.text))}</p><button data-do="likeComment" data-id="${c.id}" aria-label="喜欢评论">${S.commentLikes.includes(c.id)?'♥':'♡'} ${count((c.likes||0)+(S.commentLikes.includes(c.id)?1:0))}</button><button data-do="replyTo" data-name="${esc(c.name)}">回复</button>${c.reply?.length?`<button data-do="expandComment" data-id="${c.id}">查看 ${c.reply.length} 条回复</button>${sheet.expanded.includes(c.id)?c.reply.map((r,i)=>`<div class="comment-answer"><b>${SOCIAL_HANDLES[(i+c.name.length)%32]}</b><p>${esc(r)}</p></div>`).join(''):''}`:''}</div></article>`).join(''):'<div class="empty muted">还没有评论</div>'}</div><form id="commentForm" class="comment-compose"><input id="commentInput" aria-label="添加评论" maxlength="600" placeholder="添加评论…" autocomplete="off"><button>发送</button></form>`}</section></div>`;bindEvents(root);if($('commentForm'))$('commentForm').onsubmit=e=>{e.preventDefault();const value=$('commentInput').value.trim();if(!value)return;(S.replies[sheet.id]||(S.replies[sheet.id]=[])).push({id:'reply-'+Date.now(),name:S.igHandle,text:value,likes:0,reply:[]});save();renderSheet();if($('commentList'))$('commentList').scrollTop=$('commentList').scrollHeight};setTimeout(()=>root.querySelector?.('header button')?.focus(),0)}
function scopeOptions(platform,value){return [['public','公开'],['friends',platform==='x'?'关注者':'仅好友'],['private','仅自己']].map(([v,label])=>`<option value="${v}" ${v===value?'selected':''} ${v==='public'&&platform==='x'&&S.xPrivate?'disabled':''}>${label}</option>`).join('')}
function userPostHTML(p,grid=false){const image=p.image||(p.asset!=='none'?assetSVG(p.asset==='cropped'?'daily':p.asset):'');if(grid)return `<button class="own-grid-tile" data-do="openPost" data-id="${p.id}" aria-label="打开自己的帖子">${image?`<img src="${image}" alt="我的日常照片">`:`<span>${esc(p.caption.slice(0,55))}</span>`}${p.hidden?'<small>已隐藏</small>':''}</button>`;return `<article class="local-post"><div class="row">${avatar('self')}<div class="grow"><b>${esc(handleFor(p.platform))}</b><div class="muted">${p.scope==='public'?'公开':p.scope==='friends'?'仅好友':'仅自己'}${p.hidden?' · 已隐藏':''}</div></div><button class="linkbtn" data-do="managePost" data-id="${p.id}" aria-label="管理帖子">⋯</button></div>${image?`<img class="post-photo" src="${image}" alt="我的日常照片">`:''}<p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.caption)}</p><div class="post-metrics"><button data-do="likeOwn" data-id="${p.id}">${S.liked.includes(p.id)?'♥':'♡'} ${p.comments.length*3+(S.liked.includes(p.id)?1:0)}</button><button data-do="comments" data-id="${p.id}">♧ ${postComments(p).length} 条评论</button></div></article>`}
function worldPostHTML(p){const likes=p.group==='daily'?25+p.index*38:1800+(p.index+1)*1357;return `<article class="post"><div class="row"><div class="avatar letter">${p.name[0].toUpperCase()}</div><div><b>${p.name}</b><div class="muted">${p.handle} · ${p.group==='daily'?'今天':'刚刚'}</div></div></div><p>${p.body}</p><div class="post-metrics"><button data-do="worldComments" data-id="${p.id}">♧ ${count(p.commentCount*(p.index+2)*7)}</button><span>⇄ ${count(Math.floor(likes*.17))}</span><button data-do="worldLike" data-id="${p.id}">${S.worldLikes.includes(p.id)?'♥':'♡'} ${count(likes+(S.worldLikes.includes(p.id)?1:0))}</button><span>▥ ${count(likes*21)}</span></div></article>`}

function chatOptions(){if(contact!=='dohoon')return SIDE_TOPICS[contact].filter(t=>t.at<=S.stage&&!(t.id==='mail'&&S.flags.keychain)).map(t=>`<details class="topic"><summary>${t.title}</summary>${t.choices.map((c,i)=>`<button data-do="topic" data-id="${t.id}" data-index="${i}" ${S.usedTopics.includes(contact+':'+t.id+':'+i)?'disabled':''}>${c.text}${S.usedTopics.includes(contact+':'+t.id+':'+i)?' · 已聊过':''}</button>`).join('')}</details>`).join('');if(S.queue.length)return '<div class="typing-bubble" role="status">金道勋正在输入…</div>';if(S.flags.finished)return '<button data-go="story">回看手记</button><button data-go="instagram">去 Instagram</button>';if(stage().requires&&!S.flags[stage().requires])return '<button data-do="chatMom">问问妈妈，那串钥匙链 →</button>';if(S.step==='choice'){if(beat().call&&!S.flags.callDone)return '<button data-do="startCall">接听那通视频来电 →</button>';return beat().choices.map((c,i)=>`<button data-do="choose" data-index="${i}">${c}</button>`).join('')}if(S.step==='done')return `<button data-do="advance">${S.beat<stage().beats.length-1?(stage().beats[S.beat+1].date||'后来，再聊一会儿'):S.stage===7?'把今天留到明天':'继续 · '+STORY[S.stage+1].title} →</button>`;return '<button data-do="chatDohoon">打开对话</button>'}

function igProfileHTML(){const posts=S.posts.filter(p=>p.platform==='ig'&&!p.deleted);return `<div class="ig-profile-top"><div class="ig-own-avatar">${esc(S.name.slice(0,1))}</div><div class="ig-stats"><div><b>${posts.length}</b><span>帖子</span></div><div><b>0</b><span>粉丝</span></div><div><b>2</b><span>关注</span></div></div></div><h2 style="font-size:17px">${esc(S.name)}</h2><div class="muted">@${esc(S.igHandle)}</div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(S.bio)}</p><div class="row"><button class="secondary grow" data-go="igEdit">编辑个人主页</button><button class="secondary grow" data-do="composeIG">＋ 新帖子</button></div><div class="ig-grid-label">▦</div>${posts.length?'<div class="ig-grid">'+posts.map(p=>userPostHTML(p,true)).join('')+'</div>':'<div class="empty muted">还没有帖子</div>'}`}

;case'hangup':finishCall(false);go(returnView);break;case'mute':call.mute=!call.mute;render();break;case'camera':call.camera=!call.camera;render();break;case'play':toggleMusic();break;case'nextTrack':selectTrack(shuffle?Math.floor(Math.random()*TRACKS.length):track+1);break;case'prevTrack':selectTrack(track-1);break;case'track':selectTrack(+d.index);break;case'shuffle':shuffle=!shuffle;render();break;case'repeat':repeat=!repeat;render();break;case'reset':cancelReplies();stopAudio();finishCall(false);S=fresh();save();sheet=null;go('lock');break}}
function toggleIn(list,value){const i=list.indexOf(value);if(i<0)list.push(value);else list.splice(i,1)}
function bindForms(){if($('nameForm'))$('nameForm').onsubmit=e=>{e.preventDefault();const name=$('storyAlias').value.trim().slice(0,20);if(!name)return;S.name=name;save();go('home')};if($('renameForm'))$('renameForm').onsubmit=e=>{e.preventDefault();const name=$('rename').value.trim().slice(0,20);if(!name)return;S.name=name;save();render();toast('名字已保存。')};if($('chatForm'))$('chatForm').onsubmit=e=>{e.preventDefault();const value=$('chatInput').value.trim().slice(0,800);if(!value)return;if(contact==='dohoon'){log('me',value);if(!S.queue.length){const response=/晚安/.test(value)?['晚安。早点休息，明天再说。']:/吃|饭/.test(value)?['吃过了。你也别只喝咖啡。']:/想你/.test(value)?[S.flags.confirmed?'我也是。忙完给你打电话。':'我看到了。让我慢一点，好吗。']:['我看到了。你可以慢慢说。'];queue(response,{step:S.step==='new'?'choice':S.step})}}else{S.side[contact].push({from:'me',text:value},{from:'other',text:contact==='mom'?'妈妈看到了。想说就慢慢说，先照顾好自己。':'我在，先听你说。你不用急着把整件事想明白。'})}save();render()};
if($('publishForm')){const select=$('postAsset');select.onchange=()=>{const value=select.value;$('customPhoto').hidden=value!=='custom';$('assetPreview').hidden=['none','custom'].includes(value);if(!$('assetPreview').hidden)$('assetPreview').src=assetSVG(value==='cropped'?'daily':value)};$('publishForm').onsubmit=async e=>{e.preventDefault();const caption=$('postCaption').value.trim(),asset=$('postAsset').value,scope=$('postScope').value,file=$('customPhoto').files?.[0];if(!caption&&asset==='none')return;if(S.posts.filter(p=>!p.deleted).length>=40){toast('本机最多保存 40 条帖子，请先删除一些。');return}const button=$('publishButton');button.disabled=true;try{const image=asset==='custom'?await prepareImage(file):'';if(asset==='custom'&&!image){toast('请先选择照片。');return}const p=createPost(composePlatform,{caption,asset,scope,image});if(p){selectedPost=p.id;go('post')}}catch(err){toast(err.message)}finally{button.disabled=false}}}
if($('profileForm'))$('profileForm').onsubmit=e=>{e.preventDefault();const handle=$('profileHandle').value.trim(),isX=view==='xEdit',valid=isX?/^[A-Za-z0-9_]{1,15}$/:/^[A-Za-z0-9_.]{1,30}$/;if(!valid.test(handle)){toast(isX?'X 用户名使用 1–15 个字母、数字或下划线。':'用户名使用字母、数字、点或下划线。');return}if(isX)S.xHandle=handle;else{S.igHandle=handle;S.bio=$('profileBio').value.trim().slice(0,150)}save();go(isX?'x':'instagram')};if($('noteForm'))$('noteForm').onsubmit=e=>{e.preventDefault();S.note=$('noteText').value;save();toast('已保存。')};if($('seek'))$('seek').oninput=e=>{const a=$('previewAudio');if(Number.isFinite(a.duration))a.currentTime=Math.min(+e.target.value,a.duration)}}
function prepareImage(file){return new Promise((resolve,reject)=>{if(!file){resolve('');return}if(!file.type.startsWith('image/')||file.size>20*1024*1024){reject(Error('请选择小于 20 MB 的图片。'));return}const reader=new FileReader();reader.onerror=()=>reject(Error('图片读取失败。'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('请尝试 JPEG 或 PNG 照片。'));img.onload=()=>{try{const canvas=document.createElement('canvas'),scale=Math.min(1,720/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.76))}catch{reject(Error('图片处理失败。'))}};img.src=reader.result};reader.readAsDataURL(file)})}
function callScript(){return S.stage===4&&S.beat===2&&!S.flags.callDone?CALL_LINES:['今天也辛苦了，{name}。','吃过晚饭了吗？','你做你的事，我听着就好。','明天也联系。']}
let currentCallScript=[];
function startCall(){if(S.stage<4){toast('有些话，等准备好了再说。');return}returnView=view==='chat'?'chat':'instagram';currentCallScript=callScript();call={state:'incoming',line:0,time:0,mute:false,camera:false};view='call';render()}
function answerCall(){call.state='active';clearInterval(callTimer);callTimer=setInterval(()=>{call.time++;if($('callTimer'))$('callTimer').textContent=fmt(call.time)},1000);render()}
function nextCall(){if(call.state!=='active')return;if(call.line<currentCallScript.length-1)call.line++;if(call.line===currentCallScript.length-1&&currentCallScript===CALL_LINES){S.flags.callDone=true;save();toast('挂断后，可以继续那场对话。')}render()}
function finishCall(missed){if(call.state==='idle')return;S.calls.push({missed:!!missed,duration:call.time,time:Date.now()});clearInterval(callTimer);callTimer=null;call.state='idle';save()}
function fmt(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function stopAudio(){const a=$('previewAudio');if(a)a.pause();playing=false}
async function toggleMusic(){const a=$('previewAudio');if(playing){stopAudio();if(view==='music')render();return}try{if(a.getAttribute('data-track')!==String(track)){a.src=TRACKS[track].audio;a.setAttribute('data-track',String(track))}await a.play();playing=true;S.currentMusic=track;save();if(view==='music')render()}catch{playing=false;toast('试听暂时无法加载，可通过歌曲下方的官方链接收听。')}}
function selectTrack(i){stopAudio();track=(i+TRACKS.length)%TRACKS.length;render();toggleMusic()}
const audio=$('previewAudio');audio.addEventListener('timeupdate',()=>{if(view==='music'&&$('seek')){$('seek').max=Number.isFinite(audio.duration)?audio.duration:30;$('seek').value=audio.currentTime||0;$('audioTime').textContent=fmt(audio.currentTime||0);$('audioDuration').textContent=fmt(Number.isFinite(audio.duration)?audio.duration:30)}});audio.addEventListener('ended',()=>{playing=false;if(repeat){audio.currentTime=0;toggleMusic()}else selectTrack(shuffle?Math.floor(Math.random()*TRACKS.length):track+1)});audio.addEventListener('error',()=>{playing=false;toast('试听加载失败，可用官方音乐链接收听。')});
$('homebar').onclick=()=>go(view==='lock'?'pin':'home');$('closeApp').onclick=()=>go('home');
document.addEventListener('keydown',e=>{if(sheet&&e.key==='Escape'){sheet=null;render();return}if(view==='pin'&&/^\d$/.test(e.key))formatKey(e.key);else if(e.key==='Escape'&&!['name','lock'].includes(view))go('home')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stopAudio();if(view==='music')render()}});window.addEventListener('pagehide',()=>{stopAudio();finishCall(false);save()});setInterval(()=>{const t=clock();if($('statusTime').textContent!==t)$('statusTime').textContent=t;if($('lockClock')&&$('lockClock').textContent!==t)$('lockClock').textContent=t},1000);
$('statusTime').textContent=clock();render();
</script></body></html>
