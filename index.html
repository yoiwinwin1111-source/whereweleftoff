{date:'星期一 · 12:43',label:'一杯美式，五年以后',paragraphs:[`公司楼下的咖啡厅换了招牌。午休只剩二十分钟，你低头翻着手机里的优惠券，直到柜台后的人问：“冰的，还是热的？”`,`你抬起头。那张脸比记忆里清晰，也陌生了一点。金道勋的手停在收银屏旁，视线落在你脸上，迟迟没有移开。`,`“……冰的。”你先把目光挪开。“你在这里工作？”他低头按下订单，隔了一会儿才回答：“今天在。”`,`他把杯子递过来，指尖避开了你的手。你本来有很多话，最后只问：“可以再给我一次联系方式吗？有些话，我一直欠你。”`,`另一位店员叫他去后面取东西。你们在没有镜头的拐角停下，他看着你递来的手机，轻声问：“这次还会删掉吗？”`,`你摇头。他终于接过手机，输了号码。回到公司后，你把那张写着订单号的小票摊平，通讯录里多了一个五年没出现过的名字。`],intro:['我是金道勋。','号码没有换。你换了。'],prompt:'那条消息停在屏幕上，你想先说什么？',choices:['今天见到你，我很高兴。','我一直想跟你说声对不起。']},
{date:'星期一 · 23:08',label:'输入中，又删掉',paragraphs:[`你对着聊天框写了很长一段，又一个字一个字删掉。五年前你觉得，只要不回复，就不用面对自己承受不了的情绪。现在才知道，沉默也会留在另一个人的生活里。`,`他没有删掉你，也没有主动找你。那句“号码没有换”像一道很轻的门，门后有人，却没有邀请你进去。`,`加班结束时，窗外的写字楼只剩零散几盏灯。你发现自己已经把他的头像点开了四次。`],intro:['现在才下班？','别误会。我只是看你一直显示输入中。'],prompt:'他还在等你的回答。',choices:['我怕说什么都像是在替自己找理由。','你愿意听我说说那时候的事吗？']},
{date:'星期四 · 20:16',label:'原来你站在那么远的地方',paragraphs:[`同事把一段新节目转进工作群：“楼下咖啡店上镜了！”你点进去，镜头里的道勋系着那天的围裙。画面旁边写着：TWS DOHOON。`,`你愣了很久。你对明星的印象还停在十年前，连这个组合的名字都没有认真听过。`,`节目保留了点单时他短暂出神的画面，没有你们交换联系方式的片段。那是镜头外的事，只有你们知道。`,`你搜索他的名字，第一次看见练习室、舞台和拥挤的机场。原来这五年，他去过那么多你不知道的地方。你关掉搜索框，又打开了聊天。`],intro:['节目播了。','如果有人打扰你，告诉我。'],prompt:'你终于知道了他的身份。',choices:['我今天才知道。对不起，之前还问你是不是店员。','原来我不知道的这五年，你走了很远。']},
{date:'星期六 · 00:12',label:'这一次，听我说完',paragraphs:[`他的电话打来时，你刚洗完杯子。你看着 Instagram 上闪动的名字，忽然想起高中放学后，他总把通话拖到你家门口才肯挂。`,`那时候你觉得自己哪一样都做不好。成绩退步，一点小事也会让你难过。他越体贴，你越觉得自己在拖累他。`,`你用分手结束了那种慌乱，又用断联省掉了他的回答。你以为那是放过彼此，现在终于愿意承认，你只是害怕。`],intro:['方便接一下吗？','有些话，打字说不清楚。'],prompt:'先接听 Instagram 来电，再回到这里。',choices:['我准备好了，我们认真谈一次。','我很紧张，但这次不会躲开。']},
{date:'三周后 · 星期五',label:'不是一句想你，就能回到从前',paragraphs:[`谈完那晚，你们没有马上复合。他会隔很久才回复，你也学着不再把每一次等待都理解成拒绝。`,`有一天他答应下班后来见你，临时录制却拖到了深夜。这一次，他没有只发一句“算了”。他打电话告诉你结束时间，又在车里问你是不是已经睡了。`,`你们在便利店门口分了一份热食。他说：“我有时候还是会生气。”你点头：“你可以告诉我，不用怕我又消失。”`,`这三周没有人宣布重新开始。但你记得他的行程，他记得你周五常常加班。你们把那些很小的约定，一件一件做完。`],intro:['今天也要加班吗？','我在楼下。不是节目。','这次，是来等你的。'],prompt:'你下楼时，他把另一杯热咖啡递过来。',choices:['道勋，我们重新在一起吧。这次我会好好说。','我还是喜欢你。你愿意再给我们一次机会吗？']},
{date:'后来 · 一个普通的晚上',label:'我们从这里，继续',paragraphs:[`“我不会当那五年没有发生。”他握住你的手，声音很轻，“但以后，如果觉得辛苦，先告诉我。”`,`你们没有把关系告诉所有人。你照常上班，他照常练习。手机里多了几通没有重要内容的电话，和一些“到家了”“记得吃饭”的消息。`,`有时候你还是会想起咖啡厅里，他看着你出神的那几秒。那不是故事替你们安排好的答案。答案是后来，你们终于学会留在对话里。`,`今天你先发了一句：我到家了。屏幕很快亮起来。他说：那现在，可以打给你了吗，{name}？`],intro:['{name}，到家了吗？','今天的最后一点时间，想留给你。'],prompt:'你终于可以坦然回答。',choices:['可以。我也很想你。','打过来吧，我一直在。']}
];

async function toggleMusic(){if(playing){stopSound();render();return}try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();await audioContext.resume();if(audioContext.state!=='running')throw Error('audio unavailable');playing=true;startSound();clearInterval(musicClock);musicClock=setInterval(()=>{if(!playing)return;elapsed++;if(elapsed>=180){elapsed=0;if(!repeat)trackIndex=shuffle?Math.floor(Math.random()*tracks.length):(trackIndex+1)%tracks.length;startSound();if(view==='music')render()}if($('seek')){$('seek').value=elapsed;$('elapsed').textContent=fmt(elapsed)}},1000);render()}catch{playing=false;toast('无法启动音频，请检查 Safari 音频权限后再试。')}}
function startSound(){oscillators.forEach(o=>{try{o.stop()}catch{}});oscillators=[];if(master)master.disconnect();master=audioContext.createGain();master.gain.setValueAtTime(.0001,audioContext.currentTime);master.gain.exponentialRampToValueAtTime(.065,audioContext.currentTime+1);master.connect(audioContext.destination);tracks[trackIndex].notes.forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=f/2;g.gain.value=.26/(i+1);o.connect(g);g.connect(master);o.start();oscillators.push(o)})}
